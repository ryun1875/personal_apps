<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마인드맵</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --text: #e8e8f0;
    --text2: #8888a8;
    --accent: #7c6af7;
    --accent2: #a594f9;
    --accent-glow: rgba(124,106,247,0.18);
    --green: #4ade9a;
    --coral: #f97b6a;
    --amber: #f9c74f;
    --blue: #60a5fa;
    --pink: #f472b6;
    --node-colors: #7c6af7,#4ade9a,#f97b6a,#f9c74f,#60a5fa,#f472b6;
  }
  .light {
    --bg: #f5f4ff;
    --surface: #ffffff;
    --surface2: #f0effe;
    --border: #dddaf8;
    --text: #1a1a2e;
    --text2: #6666aa;
    --accent: #6c5ce7;
    --accent2: #8b7cf8;
    --accent-glow: rgba(108,92,231,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

  /* Login */
  #login-screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 100; gap: 24px;
  }
  .login-logo { font-size: 36px; font-weight: 700; color: var(--text); letter-spacing: -1px; }
  .login-logo span { color: var(--accent); }
  .login-sub { color: var(--text2); font-size: 14px; }
  .google-btn {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 12px 24px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    transition: all .2s; text-decoration: none;
  }
  .google-btn:hover { border-color: var(--accent); background: var(--surface2); }
  .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* Top bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 8px; z-index: 50;
  }
  .app-title { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; letter-spacing: -.5px; }
  .app-title span { color: var(--accent); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    transition: all .15s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  /* Map list drawer */
  #map-drawer {
    position: fixed; top: 52px; left: 0; bottom: 0; width: 260px;
    background: var(--surface); border-right: 1px solid var(--border);
    z-index: 40; transform: translateX(-100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #map-drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 14px 14px 10px; font-size: 12px; font-weight: 600;
    color: var(--text2); text-transform: uppercase; letter-spacing: .8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .new-map-btn {
    background: var(--accent); color: #fff; border: none;
    border-radius: 7px; padding: 4px 10px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  .new-map-btn:hover { opacity: .85; }
  #map-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .map-item {
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--text); transition: background .1s;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .map-item:hover { background: var(--surface2); }
  .map-item.active { background: var(--accent-glow); color: var(--accent2); }
  .map-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-item-del {
    opacity: 0; font-size: 16px; color: var(--text2); flex-shrink: 0;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 5px; transition: all .1s;
  }
  .map-item:hover .map-item-del { opacity: 1; }
  .map-item-del:hover { background: rgba(249,123,106,.18); color: var(--coral); }
  #drawer-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 39;
  }
  #drawer-overlay.open { display: block; }

  /* Canvas */
  #app { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; overflow: hidden; touch-action: none; }
  #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  #nodes-layer { position: absolute; top: 0; left: 0; }

  /* Node */
  .mm-node {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .node-box {
    min-width: 64px; min-height: 32px;
    padding: 7px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600; text-align: center;
    border: 2px solid; word-break: break-word; line-height: 1.4;
    transition: box-shadow .2s;
    position: relative; white-space: pre-wrap;
    cursor: grab; box-sizing: border-box;
  }
  .node-box:active { cursor: grabbing; }
  .node-box:focus { outline: none; cursor: text; }
  .node-box.selected { box-shadow: 0 0 0 3px var(--accent-glow), 0 0 16px var(--accent-glow); }
  .node-box.root { font-size: 16px; font-weight: 700; padding: 10px 20px; border-radius: 24px; }

  /* Resize handles */
  .resize-handle {
    position: absolute; width: 10px; height: 10px;
    background: var(--accent); border-radius: 2px;
    opacity: 0; transition: opacity .15s;
    z-index: 10; touch-action: none;
  }
  .mm-node.selected-node .resize-handle { opacity: 1; }
  .resize-handle.se { bottom: -5px; right: -5px; cursor: se-resize; }
  .resize-handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
  .resize-handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
  .resize-handle.nw { top: -5px; left: -5px; cursor: nw-resize; }

  /* Toolbar */
  #toolbar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 8px 10px;
    display: flex; gap: 6px; align-items: center; z-index: 50;
    box-shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  .tb-btn {
    height: 36px; border-radius: 9px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer;
    display: flex; align-items: center; gap: 6px; padding: 0 12px;
    font-size: 13px; font-weight: 500; transition: all .15s; white-space: nowrap;
  }
  .tb-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }
  .tb-btn.danger:hover { background: rgba(249,123,106,.12); color: var(--coral); border-color: var(--coral); }
  .tb-sep { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
  .color-dots { display: flex; gap: 5px; align-items: center; padding: 0 4px; }
  .cdot {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform .12s, border-color .12s;
    flex-shrink: 0;
  }
  .cdot:hover, .cdot.active { transform: scale(1.25); border-color: #fff; }

  /* Node style panel (per-parent) */
  #node-style-panel {
    position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px; z-index: 51;
    display: none; flex-direction: column; gap: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,.35); min-width: 300px;
  }
  #node-style-panel.open { display: flex; }
  .sp-section { display: flex; flex-direction: column; gap: 6px; }
  .sp-label { font-size: 10px; font-weight: 700; color: var(--text2);
    text-transform: uppercase; letter-spacing: .7px; }
  .sp-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sp-opt {
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: 500;
    color: var(--text2); background: transparent; transition: all .12s;
    gap: 5px; white-space: nowrap;
  }
  .sp-opt:hover { border-color: var(--accent); color: var(--text); }
  .sp-opt.active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent2); }
  .sp-opt svg { width: 28px; height: 16px; }

  /* Node shape variants applied via data attrs on node-box */
  .node-box[data-shape="rect"] { border-radius: 6px; }
  .node-box[data-shape="pill"] { border-radius: 20px; }
  .node-box[data-shape="underline"] {
    border-radius: 0; border-top: none; border-left: none; border-right: none;
    background: transparent !important; padding-left: 4px; padding-right: 4px;
  }
  .node-box[data-shape="diamond"] {
    border-radius: 6px; transform: rotate(2deg);
  }
  .node-box[data-shape="none"] {
    border: none; background: transparent !important;
  }

  /* Layout preset panel */
  #layout-panel {
    position: fixed; top: 62px; right: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px; z-index: 50;
    display: none; flex-direction: column; gap: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,.3); min-width: 130px;
  }
  #layout-panel.open { display: flex; }
  .layout-label { font-size: 10px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: .6px; padding: 2px 6px 4px; }
  .layout-btn {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-radius: 8px; border: none; background: transparent;
    color: var(--text); font-size: 13px; cursor: pointer; transition: background .1s;
    text-align: left;
  }
  .layout-btn:hover { background: var(--surface2); }
  .layout-btn.active { background: var(--accent-glow); color: var(--accent2); }
  .layout-icon { font-size: 16px; flex-shrink: 0; }
  #hint { position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 12px; font-size: 11px; color: var(--text2); pointer-events: none;
    opacity: 1; transition: opacity .5s; white-space: nowrap; z-index: 49;
  }
  #hint.hide { opacity: 0; }

  /* Loading */
  #loading { position: fixed; inset: 0; background: var(--bg); z-index: 200;
    display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 14px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="loading">불러오는 중...</div>

<div id="login-screen" style="display:none">
  <div class="login-logo">Mind<span>Map</span></div>
  <div class="login-sub">나만의 마인드맵</div>
  <button class="google-btn" id="google-login-btn">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Google로 로그인
  </button>
</div>

<div id="drawer-overlay"></div>
<div id="map-drawer">
  <div class="drawer-header">
    <span>내 마인드맵</span>
    <button class="new-map-btn" id="new-map-btn">+ 새 맵</button>
  </div>
  <div id="map-list"></div>
</div>

<div id="topbar" style="display:none">
  <button class="icon-btn" id="menu-btn" title="맵 목록">☰</button>
  <div class="app-title">Mind<span>Map</span></div>
  <button class="icon-btn" id="layout-btn" title="레이아웃">⊹</button>
  <button class="icon-btn" id="theme-btn" title="테마 변경">🌙</button>
  <button class="icon-btn" id="fit-btn" title="화면에 맞추기">⊡</button>
  <button class="icon-btn" id="logout-btn" title="로그아웃">⏏</button>
</div>

<!-- Layout panel -->
<div id="layout-panel">
  <div class="layout-label">레이아웃</div>
  <button class="layout-btn active" data-layout="radial">
    <span class="layout-icon">❋</span> 방사형
  </button>
  <button class="layout-btn" data-layout="tree-right">
    <span class="layout-icon">▶</span> 트리 (오른쪽)
  </button>
  <button class="layout-btn" data-layout="tree-left">
    <span class="layout-icon">◀</span> 트리 (왼쪽)
  </button>
  <button class="layout-btn" data-layout="tree-down">
    <span class="layout-icon">▼</span> 트리 (아래)
  </button>
  <button class="layout-btn" data-layout="lr-split">
    <span class="layout-icon">↔</span> 좌우 대칭
  </button>
</div>

<div id="app" style="display:none">
  <svg id="edges" style="position:fixed;top:52px;left:0;width:100%;height:calc(100% - 52px);pointer-events:none;z-index:0;overflow:visible;"></svg>
  <div id="canvas">
    <div id="nodes-layer"></div>
  </div>
  <div id="hint">더블탭: 편집 &nbsp;|&nbsp; 노드 선택 후 Tab: 자식 추가 &nbsp;|&nbsp; Delete: 삭제</div>
</div>

<!-- Node style panel -->
<div id="node-style-panel">
  <div class="sp-section">
    <div class="sp-label">연결선 스타일 (이 노드 → 자식)</div>
    <div class="sp-row" id="sp-line-row">
      <div class="sp-opt active" data-line="elbow">
        <svg viewBox="0 0 28 16"><path d="M2,8 L14,8 L14,3 L26,3 M14,8 L14,13 L26,13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>꺾임
      </div>
      <div class="sp-opt" data-line="straight">
        <svg viewBox="0 0 28 16"><line x1="2" y1="12" x2="26" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>직선
      </div>
    </div>
  </div>
  <div class="sp-section">
    <div class="sp-label">자식 노드 모양</div>
    <div class="sp-row" id="sp-shape-row">
      <div class="sp-opt active" data-shape="pill">● 둥근 박스</div>
      <div class="sp-opt" data-shape="rect">■ 사각형</div>
      <div class="sp-opt" data-shape="underline">▬ 밑줄</div>
      <div class="sp-opt" data-shape="none">○ 텍스트만</div>
    </div>
  </div>
</div>

<div id="toolbar" style="display:none">
  <button class="tb-btn" id="btn-child">＋ 자식</button>
  <button class="tb-btn" id="btn-sibling">↕ 형제</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-style" title="연결선/모양 설정">✦ 스타일</button>
  <div class="tb-sep"></div>
  <div class="color-dots" id="color-dots"></div>
  <div class="tb-sep"></div>
  <button class="tb-btn danger" id="btn-delete">✕</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0hxBZ4X-CB_x6DXwj73qEuJlBWp6trtw",
  authDomain: "personal-apps-hty.firebaseapp.com",
  projectId: "personal-apps-hty",
  storageBucket: "personal-apps-hty.firebasestorage.app",
  messagingSenderId: "1094404789428",
  appId: "1:1094404789428:web:87efdfbbb9bc08a00433e1",
  measurementId: "G-48CFC1W4ZR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const COLORS = ['#7c6af7','#4ade9a','#f97b6a','#f9c74f','#60a5fa','#f472b6'];
const COLOR_BG = {
  '#7c6af7':'rgba(124,106,247,.15)', '#4ade9a':'rgba(74,222,154,.15)',
  '#f97b6a':'rgba(249,123,106,.15)', '#f9c74f':'rgba(249,199,79,.15)',
  '#60a5fa':'rgba(96,165,250,.15)', '#f472b6':'rgba(244,114,182,.15)'
};

let uid = null, currentMapId = null, nodes = {}, edges = [], selectedId = null;
let pan = {x: 0, y: 0}, zoom = 1;
let nodeCounter = 0;
let isDark = true;
let saveTimer = null;
let currentLayout = 'radial';

// DOM refs
const loginScreen = document.getElementById('login-screen');
const loading = document.getElementById('loading');
const topbar = document.getElementById('topbar');
const appDiv = document.getElementById('app');
const toolbar = document.getElementById('toolbar');
const canvas = document.getElementById('canvas');
const nodesLayer = document.getElementById('nodes-layer');
const svgEl = document.getElementById('edges');
const mapList = document.getElementById('map-list');
const drawer = document.getElementById('map-drawer');
const overlay = document.getElementById('drawer-overlay');
const hint = document.getElementById('hint');

// Color dots
const cdots = document.getElementById('color-dots');
COLORS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'cdot'; d.style.background = c; d.dataset.color = c;
  d.addEventListener('click', () => setNodeColor(c));
  cdots.appendChild(d);
});

// Auth
document.getElementById('google-login-btn').addEventListener('click', () => {
  signInWithPopup(auth, provider).catch(e => alert('로그인 실패: ' + e.message));
});
document.getElementById('logout-btn').addEventListener('click', () => {
  if (confirm('로그아웃 할까요?')) signOut(auth);
});

onAuthStateChanged(auth, async user => {
  loading.style.display = 'none';
  if (user) {
    uid = user.uid;
    loginScreen.style.display = 'none';
    topbar.style.display = 'flex';
    appDiv.style.display = 'block';
    toolbar.style.display = 'flex';
    hint.style.display = 'block';
    await loadMapList();
    setTimeout(() => hint.classList.add('hide'), 5000);
  } else {
    uid = null; currentMapId = null;
    loginScreen.style.display = 'flex';
    topbar.style.display = 'none';
    appDiv.style.display = 'none';
    toolbar.style.display = 'none';
  }
});

// Map list
async function loadMapList() {
  mapList.innerHTML = '';
  try {
    const q = query(collection(db, 'users', uid, 'mindmaps'));
    const snap = await getDocs(q);
    const maps = [];
    snap.forEach(d => maps.push({ id: d.id, ...d.data() }));
    maps.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (maps.length === 0) { await createNewMap(); return; }
    maps.forEach(m => addMapItem(m.id, m.title || '새 마인드맵'));
    if (!currentMapId) loadMap(maps[0].id);
  } catch(e) { console.error(e); await createNewMap(); }
}

function addMapItem(id, title) {
  const el = document.createElement('div');
  el.className = 'map-item' + (id === currentMapId ? ' active' : '');
  el.dataset.id = id;
  el.innerHTML = `<span class="map-item-name">${escHtml(title)}</span><span class="map-item-del" title="삭제">✕</span>`;
  el.querySelector('.map-item-name').addEventListener('click', () => { loadMap(id); closeDrawer(); });
  el.querySelector('.map-item-del').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('이 마인드맵을 삭제할까요?')) return;
    await deleteDoc(doc(db, 'users', uid, 'mindmaps', id));
    el.remove();
    if (currentMapId === id) {
      currentMapId = null;
      const first = mapList.querySelector('.map-item');
      if (first) loadMap(first.dataset.id);
      else createNewMap();
    }
  });
  mapList.appendChild(el);
}

async function createNewMap() {
  const title = '새 마인드맵 ' + (mapList.children.length + 1);
  const id = 'map_' + Date.now();
  const rootId = 'n1';
  const defaultData = {
    title,
    updatedAt: Date.now(),
    nodes: { n1: { id:'n1', label: title, x: 0, y: 0, parentId: null, color: '#7c6af7' } },
    edges: []
  };
  await setDoc(doc(db, 'users', uid, 'mindmaps', id), defaultData);
  addMapItem(id, title);
  await loadMap(id);
  closeDrawer();
}

async function loadMap(id) {
  currentMapId = id;
  document.querySelectorAll('.map-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  clearCanvas();
  try {
    const snap = await getDoc(doc(db, 'users', uid, 'mindmaps', id));
    if (!snap.exists()) return;
    const data = snap.data();
    nodes = data.nodes || {};
    edges = data.edges || [];
    nodeCounter = Object.keys(nodes).reduce((m, k) => {
      const n = parseInt(k.replace('n','')) || 0; return Math.max(m, n);
    }, 1);
    Object.values(nodes).forEach(n => renderNode(n));
    // DOM 그려진 후 크기 측정 → 엣지 재렌더
    requestAnimationFrame(() => {
      Object.keys(nodes).forEach(id => {
        const n = nodes[id];
        if (!n.el) return;
        const box = n.el.querySelector('.node-box');
        const bw = box.offsetWidth, bh = box.offsetHeight;
        if (bw > 0) n.w = bw;
        if (bh > 0) n.h = bh;
        positionNode(id);
      });
      fitToScreen();
    });
  } catch(e) { console.error(e); }
}

function clearCanvas() {
  nodesLayer.innerHTML = '';
  svgEl.innerHTML = '';
  nodes = {}; edges = []; selectedId = null;
  pan = {x:0,y:0}; zoom=1;
  canvas.style.transform = '';
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveMap(), 1200);
}

async function saveMap() {
  if (!uid || !currentMapId) return;
  const title = nodes['n1']?.label || '마인드맵';
  const mapItem = document.querySelector(`.map-item[data-id="${currentMapId}"] .map-item-name`);
  if (mapItem) mapItem.textContent = title;
  await setDoc(doc(db, 'users', uid, 'mindmaps', currentMapId), {
    title, updatedAt: Date.now(), nodes, edges
  });
}

// Node rendering
function renderNode(n) {
  const div = document.createElement('div');
  div.className = 'mm-node';
  div.id = 'node-' + n.id;
  const box = document.createElement('div');
  const isRoot = n.parentId === null;
  box.className = 'node-box' + (isRoot ? ' root' : '');

  // 저장된 크기 적용
  if (n.w) box.style.width = n.w + 'px';
  if (n.h) box.style.height = n.h + 'px';

  // 모양: 부모의 childShape를 따름 (루트는 항상 pill)
  let shape = 'pill';
  if (!isRoot && n.parentId && nodes[n.parentId]) {
    shape = nodes[n.parentId].childShape || 'pill';
  }
  box.dataset.shape = shape;

  box.textContent = n.label;
  box.style.borderColor = n.color || '#7c6af7';
  box.style.color = n.color || '#7c6af7';
  if (shape !== 'underline' && shape !== 'none') {
    box.style.background = COLOR_BG[n.color] || 'rgba(124,106,247,.15)';
  }
  div.appendChild(box);

  // 리사이즈 핸들 4개
  ['nw','ne','sw','se'].forEach(dir => {
    const h = document.createElement('div');
    h.className = `resize-handle ${dir}`;
    h.dataset.dir = dir;
    div.appendChild(h);
    setupResizeHandle(h, n.id, dir);
  });

  nodesLayer.appendChild(div);
  nodes[n.id].el = div;
  positionNode(n.id);
  setupNodeEvents(n.id);
  renderEdges();
}

// 기존 노드 box의 모양을 새로고침
function refreshNodeShape(id) {
  const n = nodes[id];
  if (!n || !n.el) return;
  const box = n.el.querySelector('.node-box');
  const isRoot = n.parentId === null;
  let shape = 'pill';
  if (!isRoot && n.parentId && nodes[n.parentId]) {
    shape = nodes[n.parentId].childShape || 'pill';
  }
  box.dataset.shape = shape;
  if (shape !== 'underline' && shape !== 'none') {
    box.style.background = COLOR_BG[n.color] || 'rgba(124,106,247,.15)';
  } else {
    box.style.background = 'transparent';
  }
}

function positionNode(id) {
  const n = nodes[id];
  if (!n || !n.el) return;
  const box = n.el.querySelector('.node-box');
  // 저장된 크기가 있으면 적용
  if (n.w) box.style.width = n.w + 'px';
  if (n.h) box.style.height = n.h + 'px';
  // 실측 크기 (항상 양수 보장)
  const bw = (n.w || box.offsetWidth || 100);
  const bh = (n.h || box.offsetHeight || 36);
  // 크기 캐시 저장 (처음 렌더링 시)
  if (!n.w && box.offsetWidth > 0) n.w = box.offsetWidth;
  if (!n.h && box.offsetHeight > 0) n.h = box.offsetHeight;
  n.el.style.left = (n.x - bw/2) + 'px';
  n.el.style.top  = (n.y - bh/2) + 'px';
}

// 노드 실제 DOM 크기 측정 (w/h 캐시 우선, 없으면 DOM 실측)
function getNodeSize(id) {
  const n = nodes[id];
  if (!n) return { w: 100, h: 36 };
  if (n.w && n.h) return { w: n.w, h: n.h };
  if (n.el) {
    const box = n.el.querySelector('.node-box');
    const bw = box.getBoundingClientRect().width / zoom || box.offsetWidth || 100;
    const bh = box.getBoundingClientRect().height / zoom || box.offsetHeight || 36;
    if (bw > 0) n.w = bw;
    if (bh > 0) n.h = bh;
    return { w: n.w || 100, h: n.h || 36 };
  }
  return { w: 100, h: 36 };
}

// 노드 중심의 화면 좌표 + 실제 화면 크기 반환
function screenPos(id) {
  const n = nodes[id];
  const { w, h } = getNodeSize(id);
  return {
    x: n.x * zoom + pan.x,   // 화면상 중심 x
    y: n.y * zoom + pan.y,   // 화면상 중심 y
    w: w * zoom,
    h: h * zoom
  };
}

// 두 노드 사이의 방향을 보고 부모 엣지 좌표 반환
function edgePoint(sp, targetX, side) {
  // side: 'right'이면 오른쪽 엣지, 'left'이면 왼쪽 엣지
  if (side === 'right') return { x: sp.x + sp.w / 2, y: sp.y };
  return { x: sp.x - sp.w / 2, y: sp.y };
}

function renderEdges() {
  const byParent = {};
  for (const e of edges) {
    if (!nodes[e.from] || !nodes[e.to]) continue;
    if (!byParent[e.from]) byParent[e.from] = [];
    byParent[e.from].push(e.to);
  }

  let paths = '';

  for (const parentId in byParent) {
    const parent = nodes[parentId];
    if (!parent) continue;
    const childIds = byParent[parentId].filter(id => nodes[id]);
    if (!childIds.length) continue;

    const ps = screenPos(parentId);
    const lineStyle = parent.lineStyle || 'elbow';

    // 자식들의 평균 x로 방향 결정
    const avgChildX = childIds.reduce((s, id) => s + screenPos(id).x, 0) / childIds.length;
    const goRight = avgChildX >= ps.x;
    const pEdge = edgePoint(ps, avgChildX, goRight ? 'right' : 'left');

    if (lineStyle === 'straight') {
      // 직선: 부모 엣지 → 자식 엣지
      childIds.forEach(cid => {
        const c = nodes[cid];
        const cs = screenPos(cid);
        const cEdge = edgePoint(cs, ps.x, goRight ? 'left' : 'right');
        const col = c.color || '#7c6af7';
        paths += `<line x1="${pEdge.x}" y1="${pEdge.y}" x2="${cEdge.x}" y2="${cEdge.y}" stroke="${col}" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round"/>`;
      });

    } else {
      // 꺾임 (기본): 부모→수직기둥→각 자식
      if (childIds.length === 1) {
        const cid = childIds[0];
        const c = nodes[cid];
        const cs = screenPos(cid);
        const cEdge = edgePoint(cs, ps.x, goRight ? 'left' : 'right');
        const col = c.color || '#7c6af7';
        // 수직기둥 x = 부모 엣지와 자식 엣지 중간
        const mx = (pEdge.x + cEdge.x) / 2;
        paths += `<path d="M${pEdge.x},${pEdge.y} L${mx},${pEdge.y} L${mx},${cEdge.y} L${cEdge.x},${cEdge.y}" fill="none" stroke="${col}" stroke-width="2" stroke-opacity="0.65" stroke-linecap="square"/>`;
      } else {
        const childData = childIds.map(cid => {
          const c = nodes[cid];
          const cs = screenPos(cid);
          const cEdge = edgePoint(cs, ps.x, goRight ? 'left' : 'right');
          return { c, cs, cEdge };
        });

        // 수직기둥 x: 부모 엣지에서 일정 거리
        const trunkX = pEdge.x + (goRight ? 80 * zoom : -80 * zoom);
        const ys = childData.map(d => d.cEdge.y);
        const minY = Math.min(...ys), maxY = Math.max(...ys);
        const trunkCol = childData[0].c.color || '#7c6af7';

        // 부모 → 수직기둥 수평선
        paths += `<line x1="${pEdge.x}" y1="${pEdge.y}" x2="${trunkX}" y2="${pEdge.y}" stroke="${trunkCol}" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="square"/>`;
        // 수직기둥
        paths += `<line x1="${trunkX}" y1="${minY}" x2="${trunkX}" y2="${maxY}" stroke="${trunkCol}" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="square"/>`;
        // 각 자식으로 수평선
        childData.forEach(({ c, cEdge }) => {
          const col = c.color || '#7c6af7';
          paths += `<line x1="${trunkX}" y1="${cEdge.y}" x2="${cEdge.x}" y2="${cEdge.y}" stroke="${col}" stroke-width="2" stroke-opacity="0.65" stroke-linecap="square"/>`;
        });
      }
    }
  }

  svgEl.innerHTML = paths;
}

function applyTransform() {
  canvas.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
  canvas.style.transformOrigin = '0 0';
  renderEdges();
}

function fitToScreen() {
  const keys = Object.keys(nodes);
  if (!keys.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  keys.forEach(id => {
    const n = nodes[id];
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x); maxY=Math.max(maxY,n.y);
  });
  const W = appDiv.offsetWidth, H = appDiv.offsetHeight;
  const mw = maxX-minX+200, mh = maxY-minY+160;
  zoom = Math.min(1.2, Math.min(W/mw, H/mh));
  pan.x = W/2 - (minX+maxX)/2*zoom;
  pan.y = H/2 - (minY+maxY)/2*zoom;
  applyTransform();
  setTimeout(() => { Object.keys(nodes).forEach(positionNode); renderEdges(); }, 50);
}

// Node events
function setupNodeEvents(id) {
  const n = nodes[id];
  const el = n.el;
  let startX, startY, startNX, startNY, moved;

  // Pointer drag (리사이즈 핸들 제외)
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('resize-handle')) return;
    e.stopPropagation();
    selectNode(id);
    startX = e.clientX; startY = e.clientY;
    startNX = n.x; startNY = n.y; moved = false;
    el.setPointerCapture(e.pointerId);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp, {once:true});
  });
  function onMove(e) {
    const dx = (e.clientX - startX) / zoom, dy = (e.clientY - startY) / zoom;
    if (Math.abs(dx)+Math.abs(dy) > 4) moved = true;
    if (moved) { n.x = startNX+dx; n.y = startNY+dy; positionNode(id); renderEdges(); }
  }
  function onUp() {
    el.removeEventListener('pointermove', onMove);
    if (moved) scheduleSave();
  }

  // Double click/tap for edit
  let tapTimer = null, tapCount = 0;
  el.addEventListener('click', e => {
    e.stopPropagation();
    tapCount++;
    if (tapCount === 1) tapTimer = setTimeout(() => { tapCount = 0; }, 300);
    else { clearTimeout(tapTimer); tapCount = 0; startEdit(id); }
  });
  el.addEventListener('dblclick', e => { e.stopPropagation(); e.preventDefault(); startEdit(id); });
}

// Resize handle
function setupResizeHandle(handle, id, dir) {
  handle.addEventListener('pointerdown', e => {
    e.stopPropagation();
    const n = nodes[id];
    const box = n.el.querySelector('.node-box');
    const startX = e.clientX, startY = e.clientY;
    const startW = box.offsetWidth, startH = box.offsetHeight;
    handle.setPointerCapture(e.pointerId);

    function onMove(e2) {
      const dx = (e2.clientX - startX) / zoom;
      const dy = (e2.clientY - startY) / zoom;
      let newW = startW, newH = startH;
      if (dir.includes('e')) newW = Math.max(64, startW + dx);
      if (dir.includes('w')) newW = Math.max(64, startW - dx);
      if (dir.includes('s')) newH = Math.max(28, startH + dy);
      if (dir.includes('n')) newH = Math.max(28, startH - dy);
      box.style.width = newW + 'px';
      box.style.height = newH + 'px';
      n.w = newW; n.h = newH;
      // 서쪽/북쪽 드래그 시 노드 위치도 보정
      if (dir.includes('w')) { n.x = n.x - (newW - startW) / 2; }
      if (dir.includes('n')) { n.y = n.y - (newH - startH) / 2; }
      positionNode(id);
      renderEdges();
    }
    function onUp() {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      scheduleSave();
    }
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
  });
}

function selectNode(id) {
  if (selectedId) {
    const prev = nodes[selectedId];
    if (prev?.el) {
      prev.el.querySelector('.node-box').classList.remove('selected');
      prev.el.classList.remove('selected-node');
    }
  }
  selectedId = id;
  if (id && nodes[id]?.el) {
    nodes[id].el.querySelector('.node-box').classList.add('selected');
    nodes[id].el.classList.add('selected-node');
    document.querySelectorAll('.cdot').forEach(d => {
      d.classList.toggle('active', d.dataset.color === nodes[id].color);
    });
    const n = nodes[id];
    document.querySelectorAll('#sp-line-row .sp-opt').forEach(o =>
      o.classList.toggle('active', o.dataset.line === (n.lineStyle || 'curve')));
    document.querySelectorAll('#sp-shape-row .sp-opt').forEach(o =>
      o.classList.toggle('active', o.dataset.shape === (n.childShape || 'pill')));
  }
}

// Style panel open/close
const stylePanel = document.getElementById('node-style-panel');
document.getElementById('btn-style').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!selectedId) return;
  stylePanel.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!stylePanel.contains(e.target) && e.target.id !== 'btn-style') {
    stylePanel.classList.remove('open');
  }
});

// Line style selection
document.querySelectorAll('#sp-line-row .sp-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    if (!selectedId) return;
    const lineStyle = opt.dataset.line;
    nodes[selectedId].lineStyle = lineStyle;
    document.querySelectorAll('#sp-line-row .sp-opt').forEach(o =>
      o.classList.toggle('active', o.dataset.line === lineStyle));
    renderEdges();
    scheduleSave();
  });
});

// Child shape selection
document.querySelectorAll('#sp-shape-row .sp-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    if (!selectedId) return;
    const shape = opt.dataset.shape;
    nodes[selectedId].childShape = shape;
    document.querySelectorAll('#sp-shape-row .sp-opt').forEach(o =>
      o.classList.toggle('active', o.dataset.shape === shape));
    // 기존 자식 노드들에 즉시 반영
    Object.values(nodes).filter(n => n.parentId === selectedId).forEach(c => refreshNodeShape(c.id));
    scheduleSave();
  });
});

function startEdit(id) {
  const n = nodes[id];
  const box = n.el.querySelector('.node-box');
  box.contentEditable = 'true';
  box.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(box);
  sel.removeAllRanges(); sel.addRange(range);
  function finish() {
    box.contentEditable = 'false';
    const newLabel = box.textContent.trim() || n.label;
    n.label = newLabel; box.textContent = newLabel;
    box.removeEventListener('blur', finish);
    box.removeEventListener('keydown', onKey);
    positionNode(id); renderEdges(); scheduleSave();
  }
  function onKey(e) {
    if (e.key === 'Enter') { e.preventDefault(); finish(); }
    if (e.key === 'Escape') { box.textContent = n.label; finish(); }
  }
  box.addEventListener('blur', finish);
  box.addEventListener('keydown', onKey);
}

function addChild(parentId) {
  const parent = nodes[parentId];
  const children = Object.values(nodes).filter(n => n.parentId === parentId);
  const angle = (children.length * 55 - 90) * (Math.PI/180);
  const dist = 170;
  const nx = parent.x + Math.cos(angle) * dist;
  const ny = parent.y + Math.sin(angle) * dist;
  const id = 'n' + (++nodeCounter);
  const colors = COLORS;
  const color = parent.color || colors[children.length % colors.length];
  const newNode = { id, label: '새 항목', x: nx, y: ny, parentId, color };
  nodes[id] = newNode;
  edges.push({ from: parentId, to: id });
  renderNode(newNode);
  selectNode(id);
  setTimeout(() => startEdit(id), 80);
}

function addSibling(sibId) {
  const sib = nodes[sibId];
  if (!sib.parentId) { addChild(sibId); return; }
  const parent = nodes[sib.parentId];
  const children = Object.values(nodes).filter(n => n.parentId === sib.parentId);
  const angle = (children.length * 55 - 90) * (Math.PI/180);
  const nx = parent.x + Math.cos(angle) * 170;
  const ny = parent.y + Math.sin(angle) * 170;
  const id = 'n' + (++nodeCounter);
  const newNode = { id, label: '새 항목', x: nx, y: ny, parentId: sib.parentId, color: sib.color };
  nodes[id] = newNode;
  edges.push({ from: sib.parentId, to: id });
  renderNode(newNode);
  selectNode(id);
  setTimeout(() => startEdit(id), 80);
}

function deleteNode(id) {
  if (!nodes[id] || !nodes[id].parentId) return;
  const toDelete = [id];
  function collectChildren(nid) {
    Object.values(nodes).filter(n => n.parentId === nid).forEach(n => {
      toDelete.push(n.id); collectChildren(n.id);
    });
  }
  collectChildren(id);
  toDelete.forEach(nid => {
    if (nodes[nid]?.el) nodes[nid].el.remove();
    delete nodes[nid];
  });
  edges = edges.filter(e => !toDelete.includes(e.from) && !toDelete.includes(e.to));
  selectedId = null;
  renderEdges(); scheduleSave();
}

function setNodeColor(color) {
  if (!selectedId) return;
  const n = nodes[selectedId];
  n.color = color;
  const box = n.el.querySelector('.node-box');
  box.style.borderColor = color;
  box.style.background = COLOR_BG[color] || 'rgba(124,106,247,.15)';
  box.style.color = color;
  // update child edges
  renderEdges();
  document.querySelectorAll('.cdot').forEach(d => d.classList.toggle('active', d.dataset.color === color));
  scheduleSave();
}

// ── Layout presets ──────────────────────────────────────────
function applyLayout(layoutType) {
  currentLayout = layoutType;
  document.querySelectorAll('.layout-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.layout === layoutType));

  const root = Object.values(nodes).find(n => !n.parentId);
  if (!root) return;

  // BFS 순서로 자식들 수집
  function getChildren(pid) {
    return Object.values(nodes).filter(n => n.parentId === pid);
  }

  // 재귀적으로 서브트리 높이 계산 (노드 수)
  function subtreeSize(id) {
    const ch = getChildren(id);
    if (!ch.length) return 1;
    return ch.reduce((s, c) => s + subtreeSize(c.id), 0);
  }

  const GAP_X = 180, GAP_Y = 70;

  if (layoutType === 'radial') {
    // 방사형: 루트 중앙, 자식을 각도로 배분
    root.x = 0; root.y = 0;
    function placeRadial(id, startAngle, endAngle, depth) {
      const children = getChildren(id);
      if (!children.length) return;
      const r = depth * 180;
      const total = children.reduce((s, c) => s + subtreeSize(c.id), 0);
      let cur = startAngle;
      children.forEach(c => {
        const frac = subtreeSize(c.id) / total;
        const mid = cur + frac * (endAngle - startAngle) / 2;
        c.x = Math.cos(mid) * r;
        c.y = Math.sin(mid) * r;
        placeRadial(c.id, cur, cur + frac * (endAngle - startAngle), depth + 1);
        cur += frac * (endAngle - startAngle);
      });
    }
    placeRadial(root.id, -Math.PI, Math.PI, 1);

  } else if (layoutType === 'tree-right') {
    // 트리 오른쪽
    function placeTreeRight(id, x, y) {
      const n = nodes[id]; n.x = x; n.y = y;
      const children = getChildren(id);
      if (!children.length) return { minY: y, maxY: y };
      const totalH = (children.length - 1) * GAP_Y;
      let curY = y - totalH / 2;
      children.forEach(c => {
        const size = subtreeSize(c.id);
        const cy = curY + (size - 1) * GAP_Y / 2;
        placeTreeRight(c.id, x + GAP_X, cy);
        curY += size * GAP_Y;
      });
    }
    placeTreeRight(root.id, 0, 0);

  } else if (layoutType === 'tree-left') {
    function placeTreeLeft(id, x, y) {
      const n = nodes[id]; n.x = x; n.y = y;
      const children = getChildren(id);
      if (!children.length) return;
      const totalH = (children.length - 1) * GAP_Y;
      let curY = y - totalH / 2;
      children.forEach(c => {
        const size = subtreeSize(c.id);
        const cy = curY + (size - 1) * GAP_Y / 2;
        placeTreeLeft(c.id, x - GAP_X, cy);
        curY += size * GAP_Y;
      });
    }
    placeTreeLeft(root.id, 0, 0);

  } else if (layoutType === 'tree-down') {
    function placeTreeDown(id, x, y) {
      const n = nodes[id]; n.x = x; n.y = y;
      const children = getChildren(id);
      if (!children.length) return;
      const totalW = (children.length - 1) * GAP_X;
      let curX = x - totalW / 2;
      children.forEach(c => {
        const size = subtreeSize(c.id);
        const cx = curX + (size - 1) * GAP_X / 2;
        placeTreeDown(c.id, cx, y + GAP_Y * 1.3);
        curX += size * GAP_X;
      });
    }
    placeTreeDown(root.id, 0, 0);

  } else if (layoutType === 'lr-split') {
    // 좌우 대칭: 자식을 반씩 좌우로
    root.x = 0; root.y = 0;
    const children = getChildren(root.id);
    const left = children.filter((_, i) => i % 2 === 1);
    const right = children.filter((_, i) => i % 2 === 0);
    function placeSide(list, dir) {
      const totalH = (list.length - 1) * GAP_Y;
      let curY = -totalH / 2;
      list.forEach(c => {
        c.x = dir * GAP_X; c.y = curY;
        function placeSubRight(id, x, y) {
          const ch = getChildren(id);
          if (!ch.length) return;
          const th = (ch.length - 1) * GAP_Y;
          let cy = y - th / 2;
          ch.forEach(cc => {
            cc.x = x + dir * GAP_X; cc.y = cy;
            placeSubRight(cc.id, cc.x, cc.y);
            cy += GAP_Y;
          });
        }
        placeSubRight(c.id, c.x, c.y);
        curY += GAP_Y;
      });
    }
    placeSide(right, 1);
    placeSide(left, -1);
  }

  // 위치 반영
  Object.values(nodes).forEach(n => positionNode(n.id));
  renderEdges();
  setTimeout(fitToScreen, 60);
  scheduleSave();
}

// Layout panel toggle
const layoutPanel = document.getElementById('layout-panel');
document.getElementById('layout-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  layoutPanel.classList.toggle('open');
});
document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    applyLayout(btn.dataset.layout);
    layoutPanel.classList.remove('open');
  });
});
document.addEventListener('click', (e) => {
  if (!layoutPanel.contains(e.target) && e.target.id !== 'layout-btn') {
    layoutPanel.classList.remove('open');
  }
});
// ────────────────────────────────────────────────────────────

// Toolbar
document.getElementById('btn-child').addEventListener('click', () => {
  if (selectedId) addChild(selectedId);
  else { const r = Object.values(nodes).find(n=>!n.parentId); if(r) addChild(r.id); }
});
document.getElementById('btn-sibling').addEventListener('click', () => { if (selectedId) addSibling(selectedId); });
document.getElementById('btn-delete').addEventListener('click', () => { if (selectedId) deleteNode(selectedId); });

// Keyboard
document.addEventListener('keydown', e => {
  if (document.activeElement.contentEditable === 'true') return;
  if (e.key === 'Tab') { e.preventDefault(); if (selectedId) addChild(selectedId); }
  if (e.key === 'Enter') { e.preventDefault(); if (selectedId) addSibling(selectedId); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) deleteNode(selectedId);
});

// Canvas pan
let panStart = null;
appDiv.addEventListener('pointerdown', e => {
  if (e.target !== appDiv && e.target !== canvas && e.target !== svgEl) return;
  panStart = { mx: e.clientX, my: e.clientY, ox: pan.x, oy: pan.y };
  appDiv.setPointerCapture(e.pointerId);
});
appDiv.addEventListener('pointermove', e => {
  if (!panStart) return;
  pan.x = panStart.ox + (e.clientX - panStart.mx);
  pan.y = panStart.oy + (e.clientY - panStart.my);
  applyTransform();
});
appDiv.addEventListener('pointerup', () => { panStart = null; });

// Pinch zoom
let pinchDist = null;
appDiv.addEventListener('touchstart', e => { if (e.touches.length===2) { pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); } }, {passive:true});
appDiv.addEventListener('touchmove', e => {
  if (e.touches.length!==2 || !pinchDist) return;
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  zoom = Math.max(0.3, Math.min(2.5, zoom * d/pinchDist));
  pinchDist = d; applyTransform();
}, {passive:true});
appDiv.addEventListener('touchend', () => { pinchDist = null; });

// Wheel zoom
appDiv.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.max(0.3, Math.min(2.5, zoom*delta));
  applyTransform();
}, {passive:false});

// Click outside deselect
appDiv.addEventListener('click', e => {
  if (e.target === appDiv || e.target === canvas || e.target === svgEl) selectNode(null);
});

// Menu / drawer
document.getElementById('menu-btn').addEventListener('click', () => drawer.classList.toggle('open') || overlay.classList.toggle('open'));
overlay.addEventListener('click', closeDrawer);
function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }

document.getElementById('new-map-btn').addEventListener('click', createNewMap);

// Theme
document.getElementById('theme-btn').addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
});

// Fit
document.getElementById('fit-btn').addEventListener('click', fitToScreen);

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

window.addEventListener('resize', () => { renderEdges(); Object.keys(nodes).forEach(positionNode); });
</script>
</body>
