<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>불량 보고</title>
<style>
  :root{--bg:#15171a;--panel:#1e2125;--panel2:#262a2f;--line:#34393f;--ink:#f2f4f6;--sub:#9aa3ab;
    --bruise:#e0485b;--bone:#e8a33d;--cut:#4aa7dc;--flesh:#b978d6;--go:#2fb56b;--accent:#5aa9ff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:17px;line-height:1.4;padding:0 0 130px;}
  .wrap{max-width:480px;margin:0 auto;padding:14px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px;}
  header h1{font-size:19px;margin:0;letter-spacing:-.3px;}
  header .reset{background:none;border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:8px 12px;font-size:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  .lbl{font-size:13px;color:var(--sub);margin:0 0 8px;font-weight:600;letter-spacing:.2px;}
  .lblrow{display:flex;align-items:center;justify-content:space-between;}
  .lblrow .edit{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:5px 10px;font-size:12px;}
  .lblrow .edit.on{color:var(--accent);border-color:var(--accent);}
  .row{display:flex;gap:10px;}.row>*{flex:1;}
  input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:14px 12px;font-size:18px;font-weight:700;text-align:center;}
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  .field{margin-bottom:12px;}.field:last-child{margin-bottom:0;}
  .btnrow{display:flex;gap:8px;}
  .bigbtn{width:100%;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:800;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .label-btn{background:linear-gradient(180deg,#3a6fb0,#2c5790);}
  .label-btn.alt2{background:var(--panel2);border:1px solid var(--line);color:var(--ink);}
  .bigbtn:active{filter:brightness(.9);}
  .toggle{display:flex;gap:8px;}
  .toggle button{flex:1;padding:14px 0;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--sub);font-size:18px;font-weight:800;}
  .toggle button.on{background:var(--accent);color:#08111e;border-color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel2);color:var(--sub);font-size:15px;font-weight:700;}
  .chip.on{background:#3a3f46;color:var(--ink);border-color:var(--accent);}
  .chip .del{width:18px;height:18px;border-radius:50%;background:#000a;color:#fff;border:none;font-size:13px;line-height:18px;}
  .addmaker{display:flex;gap:8px;margin-top:10px;}
  .addmaker input{flex:1;text-align:left;font-size:16px;font-weight:600;padding:11px;}
  .addmaker button{border:none;border-radius:12px;background:var(--accent);color:#08111e;font-weight:800;padding:0 16px;}
  .defect-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  .defect-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .defect-total{font-size:13px;color:var(--sub);font-weight:700;}
  .defect-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .defect-tab{--defect-color:var(--sub);--defect-bg:var(--panel2);min-width:0;min-height:56px;padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--sub);font-size:17px;font-weight:800;}
  .defect-tab.bruise,.defect-panel.bruise{--defect-color:var(--bruise);--defect-bg:rgba(224,72,91,.10);}
  .defect-tab.bone,.defect-panel.bone{--defect-color:var(--bone);--defect-bg:rgba(232,163,61,.10);}
  .defect-tab.cut,.defect-panel.cut{--defect-color:var(--cut);--defect-bg:rgba(74,167,220,.10);}
  .defect-tab.flesh,.defect-panel.flesh{--defect-color:var(--flesh);--defect-bg:rgba(185,120,214,.10);}
  .defect-tab.on{background:var(--defect-bg);color:var(--defect-color);border-color:var(--defect-color);box-shadow:inset 0 0 0 1px var(--defect-color);}
  .defect-tab:active{filter:brightness(.9);}
  .tabcount{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 7px;
    border-radius:999px;background:#0005;color:inherit;font-size:15px;font-variant-numeric:tabular-nums;}
  .defect-panel{margin-top:10px;border-radius:14px;padding:14px;border:1px solid var(--defect-color);background:var(--defect-bg);}
  .defect-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .defect-name{font-size:19px;font-weight:800;}
  .defect-panel .defect-name{color:var(--defect-color);}
  .count{font-size:30px;font-weight:900;min-width:54px;text-align:right;font-variant-numeric:tabular-nums;}
  .addbtn{flex:1;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:800;color:#fff;}
  .defect-panel .addbtn.primary{background:var(--defect-color);}
  .defect-panel.bone .addbtn.primary{color:#241a06;}
  .addbtn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);}
  .addbtn:active{filter:brightness(.9);}
  .clearrow{text-align:right;margin-top:8px;}
  .clearrow button{background:none;border:none;color:var(--sub);font-size:13px;text-decoration:underline;}
  .thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb .x{position:absolute;top:0;right:0;width:30px;height:30px;border-radius:0 0 0 10px;
    background:#000c;color:#fff;font-size:18px;line-height:30px;text-align:center;border:none;}
  .preview{background:#0f1113;border:1px dashed var(--line);border-radius:14px;padding:16px;
    font-size:19px;font-weight:800;letter-spacing:-.2px;line-height:1.5;word-break:keep-all;white-space:pre-wrap;min-height:30px;}
  .hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5;}
  .hint.warn{color:var(--bone);font-weight:700;}
  .totline{font-size:12px;color:var(--sub);margin-top:6px;}
  .hist .lblrow{margin-bottom:10px;}
  .hist .clr{background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;}
  .hitem{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-top:1px solid var(--line);}
  .hitem .ht{flex:none;font-size:11px;color:var(--sub);width:62px;padding-top:2px;}
  .hitem .hm{flex:1;font-size:14px;font-weight:600;word-break:keep-all;white-space:pre-wrap;line-height:1.45;}
  .hitem .hb{flex:none;display:flex;gap:6px;}
  .hitem .hb button{background:var(--panel2);border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 9px;font-size:12px;}
  .empty{color:var(--sub);font-size:13px;padding:6px 0;}
  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,#15171acc,#15171a);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .bar .wrap{padding:0;display:flex;gap:10px;}
  .share{background:var(--go);flex:2;}.copy{background:var(--panel2);border:1px solid var(--line);color:var(--ink);flex:1;}
  .share:disabled{opacity:.55;}
  .session-gate{position:fixed;inset:0;z-index:100;background:#15171aee;display:grid;place-items:center;padding:24px;}
  .session-gate[hidden]{display:none;}
  .session-gate p{max-width:360px;white-space:pre-line;text-align:center;line-height:1.7;}
  input[type=file]{display:none;}
  /* 라이브 카메라 */
  html.cam-open,body.cam-open{overflow:hidden;overscroll-behavior:none;}
  body.cam-open{position:fixed;left:0;right:0;width:100%;}
  .cam{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column;overflow:hidden;overscroll-behavior:none;}
  .camtop{display:flex;flex-direction:column;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;color:#fff;font-size:18px;font-weight:800;}
  .camtitle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .camsettings{display:flex;gap:8px;}
  .camtop button{background:#ffffff22;border:1px solid #ffffff22;color:#fff;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:700;touch-action:manipulation;}
  .camsettings button{flex:1;}
  .camtitle-row .camclose{background:#ffffff30;border-color:#ffffff55;font-weight:800;}
  #camVideo{flex:1;width:100%;object-fit:cover;background:#000;min-height:0;touch-action:none;}
  .cambottom{display:flex;align-items:center;justify-content:space-between;padding:14px 16px calc(16px + env(safe-area-inset-bottom));}
  .camcount{color:#fff;font-size:13px;width:96px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;}.camcount b{font-size:22px;}
  .camcount button{background:#ffffff18;border:1px solid #ffffff33;color:#fff;padding:6px 7px;border-radius:8px;font-size:11px;white-space:nowrap;touch-action:manipulation;}
  .camcount button:disabled{opacity:.35;}
  .shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #ffffff55;}
  .shutter:active{transform:scale(.92);}
  .shutter:disabled{opacity:.35;transform:none;}
  .camspace{width:96px;text-align:right;}
  .camspace button{min-width:86px;min-height:48px;background:#ffffff2b;border:1px solid #ffffff55;color:#fff;padding:9px 10px;border-radius:10px;font-size:15px;font-weight:800;touch-action:manipulation;}
</style>
</head>
<body>
<div class="session-gate" id="sessionGate" role="status" aria-live="polite"><p id="sessionMessage">작업 내용을 확인하고 있어요…</p></div>
<div class="wrap" id="appContent" inert>
  <header><h1>불량 보고</h1><button class="reset" onclick="resetAll()">초기화</button></header>
  <div class="hint" id="draftStatus" role="status" aria-live="polite">사진 임시저장 확인 중…</div>

  <!-- 라벨 (여러 장) -->
  <div class="card">
    <p class="lbl">① 라벨 사진 (여러 장 가능)</p>
    <div class="btnrow">
      <button class="bigbtn label-btn" onclick="openCam('label')">📷 촬영</button>
      <button class="bigbtn label-btn alt2" onclick="$('labelAlbum').click()">🖼 앨범</button>
    </div>
    <input type="file" id="labelAlbum" accept="image/*" multiple>
    <div class="thumbs" id="thLabel"></div>
    <div class="clearrow" id="clrLabel" style="display:none"><button onclick="clearType('label')">라벨 사진 전체 삭제</button></div>
  </div>

  <!-- 기본정보 -->
  <div class="card">
    <p class="lbl">② 기본 정보</p>
    <div class="row field">
      <div><div class="lbl" style="text-align:center">입고</div><input type="text" id="ipgo"></div>
      <div><div class="lbl" style="text-align:center">기한</div><input type="text" id="gihan" placeholder="6.30"></div>
    </div>
    <div class="field">
      <div class="lblrow"><div class="lbl">제조사</div><button class="edit" id="makerEdit" onclick="toggleMakerEdit()">편집</button></div>
      <div class="chips" id="makerChips"></div>
      <div class="addmaker" id="addMakerRow" style="display:none">
        <input type="text" id="newMaker" placeholder="새 제조사 이름"><button onclick="addMakerPreset()">추가</button>
      </div>
      <input type="text" id="makerEtc" placeholder="일회성 직접 입력" style="margin-top:8px;text-align:left;font-size:16px;font-weight:600">
    </div>
    <div class="field">
      <div class="lbl">종류</div>
      <div class="toggle" id="kindToggle"><button data-k="북채" class="on">북채</button><button data-k="통날개">통날개</button><button data-k="신선육">신선육</button></div>
    </div>
    <div class="field">
      <div class="lbl">손질 봉 수</div>
      <div class="chips" id="bongChips"></div>
      <input type="text" id="bongEtc" inputmode="numeric" placeholder="직접 입력 (숫자)" style="margin-top:8px;text-align:left;font-size:16px;font-weight:600">
    </div>
    <div class="field" id="quantityField">
      <label class="lbl" for="actualCount">실제 나온 전체 개수 (불량 포함 · 선택)</label>
      <input type="text" id="actualCount" inputmode="numeric" placeholder="예: 67" aria-describedby="quantityHint inputError">
      <div class="hint" id="quantityHint" aria-live="polite"></div>
    </div>
    <div class="hint warn" id="inputError" role="alert" hidden></div>
  </div>

  <!-- 불량 사진: 4종 탭 + 공용 촬영 영역 -->
  <div class="defect-card">
    <div class="defect-section-head"><p class="lbl" style="margin:0">③ 불량 사진</p><span class="defect-total" id="defectTotal">총 0장</span></div>
    <div class="defect-tabs" id="defectTabs" role="tablist" aria-label="불량 종류">
      <button class="defect-tab bruise on" id="tabBruise" data-defect="bruise" role="tab" aria-selected="true" onclick="selectDefect('bruise')"><span>피멍</span><b class="tabcount">0</b></button>
      <button class="defect-tab bone" id="tabBone" data-defect="bone" role="tab" aria-selected="false" onclick="selectDefect('bone')"><span>골절</span><b class="tabcount">0</b></button>
      <button class="defect-tab cut" id="tabCut" data-defect="cut" role="tab" aria-selected="false" onclick="selectDefect('cut')"><span>절단</span><b class="tabcount">0</b></button>
      <button class="defect-tab flesh" id="tabFlesh" data-defect="flesh" role="tab" aria-selected="false" onclick="selectDefect('flesh')"><span>살점불량</span><b class="tabcount">0</b></button>
    </div>
    <div class="defect-panel bruise" id="defectPanel" role="tabpanel" aria-labelledby="tabBruise">
      <div class="defect-top"><span class="defect-name" id="defectName">● 피멍</span><span class="count" id="defectCount">0</span></div>
      <div class="btnrow">
        <button class="addbtn primary" onclick="openDefectCam()">📷 촬영</button>
        <button class="addbtn alt" onclick="openDefectAlbum()">🖼 앨범</button>
      </div>
      <input type="file" id="defectAlbum" accept="image/*" multiple>
      <div class="thumbs" id="defectThumbs"></div>
      <div class="clearrow" id="defectClear" style="display:none"><button id="defectClearBtn" onclick="clearActiveDefect()">피멍 사진 전체 삭제</button></div>
    </div>
    <div class="hint">불량 종류를 먼저 고른 뒤 촬영하세요. 탭의 숫자로 종류별 사진 수를 바로 확인할 수 있어요.</div>
  </div>

  <!-- 메시지 -->
  <div class="card">
    <p class="lbl">④ 보낼 메시지</p>
    <div class="preview" id="preview">—</div>
    <div class="totline" id="totLine"></div>
    <div class="hint" id="batchHint" style="display:none"></div>
    <div class="hint">불량 사진 먼저, 라벨은 맨 끝에 첨부돼요. 사진 추가하면 개수가 자동으로 세져요.</div>
    <div class="hint" id="diagLine" style="opacity:.7"></div>
  </div>

  <!-- 기록 -->
  <div class="card hist">
    <div class="lblrow"><p class="lbl" style="margin:0">📋 최근 보고 기록</p><button class="clr" onclick="clearHistory()">전체 지우기</button></div>
    <div id="histList"></div>
  </div>
</div>

<div class="bar" id="actionBar" inert><div class="wrap">
  <button class="bigbtn copy" onclick="copyText(event)">문자 복사</button>
  <button class="bigbtn share" id="shareBtn" onclick="shareAll()">공유 (사진+문자)</button>
</div></div>

<!-- 라이브 카메라 오버레이 -->
<div class="cam" id="camOverlay">
  <div class="camtop">
    <div class="camtitle-row"><span id="camTitle">촬영</span><button class="camclose" onclick="closeCam()">닫기 ✕</button></div>
    <div class="camsettings"><button id="camSoundBtn" onclick="toggleCamSound()">소리 🔊</button><button id="camSaveBtn" onclick="toggleCamSave()">원본저장 ✗</button></div>
  </div>
  <video id="camVideo" playsinline muted></video>
  <div class="cambottom">
    <span class="camcount"><span>이번 <b id="camCount">0</b>장</span><button id="camUndoBtn" onclick="camUndo()" disabled>최근 1장 삭제</button></span>
    <button class="shutter" id="camShutterBtn" onclick="camShoot()" aria-label="카메라 준비 중" disabled></button>
    <span class="camspace"><button onclick="closeCam()">나가기</button></span>
  </div>
</div>

<script>
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
         set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const DEFAULT_MAKERS=["마니커","케이탑푸드","하림","체리부로","사조"];
const MAX_PER_SEND=10, SIZE_BUDGET=8*1024*1024;   // 브라우저 공유 한계: 1회 10장 · 약 8MB
const APP_VER="v1.19 (수량 입력 오류 방지)";
const rawMakers=LS.get("dr_makers",null);
let makers=Array.isArray(rawMakers)
  ? [...new Set(rawMakers.filter(m=>typeof m==="string").map(m=>m.trim()).filter(Boolean))]
  : DEFAULT_MAKERS.slice();
if(Array.isArray(rawMakers)&&rawMakers.length&&!makers.length)makers=DEFAULT_MAKERS.slice();
const rawHistory=LS.get("dr_history",null);
let history=Array.isArray(rawHistory)
  ? rawHistory.filter(h=>h&&typeof h==="object"&&typeof h.t==="string"&&typeof h.m==="string").slice(0,20)
  : [];
const KINDS=["북채","통날개","신선육"];
function normalizeKind(value,fallback=""){const v=value==="날개"?"통날개":value;return KINDS.includes(v)?v:fallback;}
let maker="",kind=KINDS[0],bong="",editMakers=false,queue=[];
const BONG=[1,2,3,4,5];
const COMP_MAX=1600, COMP_Q=0.80;      // 공유 시 압축(용량 우선)
let camSave=LS.get("dr_camsave",false)===true;  // 라이브 카메라 원본 저장(기본 꺼짐, 필요시 토글)
function compressFile(file){return new Promise(resolve=>{
  if(!file.type||file.type.indexOf("image/")!==0)return resolve(file);
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;
    if(Math.max(w,h)<=COMP_MAX){URL.revokeObjectURL(url);return resolve(file);}
    const s=COMP_MAX/Math.max(w,h),nw=Math.round(w*s),nh=Math.round(h*s);
    const c=document.createElement("canvas");c.width=nw;c.height=nh;
    c.getContext("2d").drawImage(img,0,0,nw,nh);
    c.toBlob(b=>{URL.revokeObjectURL(url);resolve(b?new File([b],file.name,{type:"image/jpeg"}):file);},"image/jpeg",COMP_Q);};
  img.onerror=()=>{URL.revokeObjectURL(url);resolve(file);};img.src=url;});}
function saveToDevice(blob,name){try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}catch(e){}}
function toggleCamSave(){camSave=!camSave;LS.set("dr_camsave",camSave);$("camSaveBtn").textContent=camSave?"원본저장 ✓":"원본저장 ✗";}
const savedCamSound=LS.get("dr_camsound",true);
let camSound=typeof savedCamSound==="boolean"?savedCamSound:true;  // 셔터음
let _ac=null;
function shutterSound(){if(!camSound)return;
  try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const ac=_ac;if(ac.state==="suspended")ac.resume();
    const t=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="square";o.frequency.setValueAtTime(1700,t);o.frequency.exponentialRampToValueAtTime(900,t+0.05);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.09);
  }catch(e){}}

  const summary=["총 "+(defectPhotoCount()+(q?.shortage||0))+"개"];if(bong)summary.push(bong+"봉");

function quantityError(){
  if(bong!==""&&(!/^\d{1,9}$/.test(bong)||Number(bong)<=0))return "손질 봉 수는 1 이상의 정수로 입력해 주세요. (최대 9자리)";

  if(!/^\d{1,9}$/.test(raw))return "전체 개수는 0 이상의 정수로 입력해 주세요. 소수·음수·문자는 사용할 수 없어요. (최대 9자리)";

function totalCount(){return defectPhotoCount()+labels.length;}
function allPhotos(){const all=[];DEFECT_KEYS.forEach(key=>all.push(...TCFG[key].arr));all.push(...labels);return all;}
const MIME_EXT={"image/jpeg":"jpg","image/jpg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","image/avif":"avif",
  "image/heic":"heic","image/heif":"heif","image/heic-sequence":"heics","image/heif-sequence":"heifs","image/bmp":"bmp","image/tiff":"tiff","image/svg+xml":"svg"};
const EXT_MIME={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",avif:"image/avif",
  heic:"image/heic",heif:"image/heif",heics:"image/heic-sequence",heifs:"image/heif-sequence",bmp:"image/bmp",tif:"image/tiff",tiff:"image/tiff",svg:"image/svg+xml"};
function shareFileMeta(file){const raw=String(file.type||"").toLowerCase().split(";",1)[0];
  const match=String(file.name||"").match(/\.([a-z0-9]{1,8})$/i);let ext=MIME_EXT[raw]||(match?match[1].toLowerCase():"bin");
  if(ext==="jpeg")ext="jpg";let type=raw==="image/jpg"?"image/jpeg":raw;

function namedFiles(){const items=[];
  DEFECT_KEYS.forEach(key=>{const cfg=TCFG[key];cfg.arr.forEach(p=>items.push({file:p.c||p.file,tag:cfg.fileTag}));});
  labels.forEach(p=>items.push({file:p.c||p.file,tag:TCFG.label.fileTag}));
  return items.map((it,i)=>{const {ext,type}=shareFileMeta(it.file);
    const name=String(i+1).padStart(3,"0")+"_"+it.tag+"."+ext;
    try{return new File([it.file],name,{type});}catch(e){return it.file;}});}
async function prepareQueue(){                // 압축은 추가 시점에 이미 완료 — 여기선 대기만(즉시)
  const all=allPhotos();
  await Promise.all(all.map(p=>p.ready||Promise.resolve()));
  const files=namedFiles();
  const batches=[];let cur=[],bytes=0;
  for(const f of files){
    if(cur.length>=MAX_PER_SEND || (cur.length>0 && bytes+(f.size||0)>SIZE_BUDGET)){batches.push(cur);cur=[];bytes=0;}
    cur.push(f);bytes+=(f.size||0);
  }
  if(cur.length)batches.push(cur);
  if(!batches.length)batches.push([]);
  return batches.map((c,i)=>({files:c,idx:i+1,total:batches.length}));}
function processingPhotoCount(){return pendingCaptureTokens.size+allPhotos().filter(p=>p.processing).length;}
function updateShareUI(){const btn=$("shareBtn"),hint=$("batchHint"),tot=totalCount();
  if(shareBusy){btn.disabled=true;btn.textContent="공유 중…";return;}
  const processing=processingPhotoCount();
  if(processing){btn.disabled=true;btn.textContent=`사진 처리 중 (${processing})`;
    hint.style.display="block";hint.className="hint warn";hint.textContent="첨부 사진을 준비하고 있어요. 잠시만 기다려 주세요.";return;}
  btn.disabled=false;
  if(queue.length>0&&queue[0].total>1){const b=queue[0];btn.textContent=`남은 사진 전송 (${b.idx}/${b.total})`;
    hint.style.display="block";hint.className="hint warn";hint.textContent=`아직 ${queue.length}묶음 남았어요. 버튼을 눌러 ${b.idx}/${b.total}번째를 마저 보내세요.`;return;}
  btn.textContent="공유 (사진+문자)";
  if(tot>MAX_PER_SEND){hint.style.display="block";hint.className="hint warn";
    hint.textContent=`사진 ${tot}장 — 10장씩 나눠 전송돼요. 문구는 마지막 묶음에 함께 붙어요.`;}
  else hint.style.display="none";}
async function shareAll(){
  if(shareBusy)return;
  if(quantityError()){flash(quantityError());return;}
  if(processingPhotoCount()){updateShareUI();return;}
  shareBusy=true;updateShareUI();const revision=photoRevision,msg=buildMsg();let notice="";
  try{
    if(queue.length===0){const prepared=await prepareQueue();
      if(revision!==photoRevision||processingPhotoCount())return;queue=prepared;}
    const batch=queue[0],isLast=batch.idx===batch.total,text=isLast?msg:"",files=batch.files,hasF=files.length>0;
    const canTF=hasF&&text&&navigator.canShare&&navigator.canShare({text,files});
    const canF=hasF&&navigator.canShare&&navigator.canShare({files});
    let reportSaved=false;
    if(canTF){
      await navigator.share({text,files});reportSaved=true;
    }else if(canF){
      const copied=text?await writeClipboard(text):false;
      await navigator.share({files});
      reportSaved=copied;
      if(text)notice=copied?"사진 첨부됨 · 문자는 복사됐어요 → 메시지창에서 길게 눌러 붙여넣기":"사진은 첨부됐지만 문자 복사에 실패했어요. 미리보기 문구를 직접 선택해 복사해 주세요.";
    }else if(hasF){
      const copied=await writeClipboard(msg);if(copied)pushHistory(msg);
      notice="이 브라우저에서 사진 공유를 지원하지 않아요. "+(copied?"문자는 복사됐어요.":"문자 복사도 실패했어요. 미리보기 문구를 직접 선택해 복사해 주세요.");return;
    }else{
      if(navigator.share){await navigator.share({text:msg});reportSaved=true;}
      else{reportSaved=await writeClipboard(msg);notice=reportSaved?"문자가 복사됐어요.":"문자 복사에 실패했어요. 미리보기 문구를 직접 선택해 복사해 주세요.";if(!reportSaved)return;}
    }
    if(isLast&&reportSaved)pushHistory(msg);
    if(queue[0]===batch)queue.shift();
  }catch(err){if(err&&err.name==="AbortError")return;
    const copied=await writeClipboard(msg);if(copied)pushHistory(msg);
    notice="공유에 실패했어요. 남은 사진은 유지되니 다시 시도해 주세요. "+(copied?"문자는 복사됐어요.":"문자 복사도 실패했어요. 미리보기 문구를 직접 선택해 복사해 주세요.");
  }finally{shareBusy=false;updateShareUI();if(notice)flash(notice);}}
async function writeClipboard(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){return false;}}
function flash(msg){const h=$("batchHint");h.style.display="block";h.className="hint warn";h.textContent=msg;
  setTimeout(()=>updateShareUI(),6000);}
async function copyText(ev){if(quantityError()){flash(quantityError());return;}const msg=buildMsg();if(!await writeClipboard(msg)){flash("문자 복사에 실패했어요. 미리보기 문구를 직접 선택해 복사해 주세요.");return;}pushHistory(msg);
  if(ev&&ev.target){const b=ev.target,t=b.textContent;b.textContent="복사됨!";setTimeout(()=>b.textContent=t,1200);}}

// ── 초기화 ──
function resetAll(){if(!confirm("현재 입력과 사진을 모두 지울까요?\n(제조사 목록·보고 기록은 유지됩니다)"))return;
  photoRevision++;
  [...DEFECT_KEYS,"label"].forEach(key=>{const cfg=TCFG[key];cancelPendingCaptures(cfg);cfg.rev++;const a=cfg.arr;a.forEach(p=>URL.revokeObjectURL(p.url));a.length=0;});
  maker="";bong="";queue=[];$("actualCount").value="";
  activeDefect=DEFECT_KEYS[0];renderDefectUI();renderThumbsFor("label");
  $("gihan").value="";$("makerEtc").value="";$("bongEtc").value="";$("ipgo").value=todayMD();
  kind=KINDS[0];$("kindToggle").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.k===kind));
  renderMakerChips();renderBongChips();render();updateShareUI();savePhotoDraft();}

// ── 사진 임시저장 (같은 브라우저·주소에서 복원) ──
let photoDB=null,photoDraftReady=false,photoSaveChain=Promise.resolve(),photoSaveVersion=0,photoSavePending=0,photoSaveFailed=false;
function draftStatus(message,warning=false){$("draftStatus").textContent=message;$("draftStatus").className="hint"+(warning?" warn":"");}
function openPhotoDB(){return new Promise((resolve,reject)=>{
  let finished=false,request;
  const timer=setTimeout(()=>fail(new Error("저장 공간 응답 없음")),5000);
  function fail(error){if(finished)return;finished=true;clearTimeout(timer);reject(error);}
  try{request=indexedDB.open("defect-report-draft",1);
    request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains("drafts"))request.result.createObjectStore("drafts");};
    request.onerror=()=>fail(request.error);request.onblocked=()=>fail(new Error("저장 공간 사용 중"));
    request.onsuccess=()=>{if(finished){request.result.close();return;}finished=true;clearTimeout(timer);resolve(request.result);};
  }catch(e){fail(e);}
});}
function photoDraftTransaction(mode,value){return new Promise((resolve,reject)=>{
  let tx,result,timer;
  try{tx=photoDB.transaction("drafts",mode);const store=tx.objectStore("drafts");
    const req=mode==="readonly"?store.get("current"):store.put(value,"current");
    req.onsuccess=()=>{result=req.result;};
    tx.oncomplete=()=>{clearTimeout(timer);resolve(result);};
    tx.onabort=tx.onerror=()=>{clearTimeout(timer);reject(tx.error||new Error("임시저장 실패"));};
    timer=setTimeout(()=>{try{tx.abort();}catch(e){}reject(new Error("임시저장 시간 초과"));},10000);
  }catch(e){clearTimeout(timer);reject(e);}
});}
function savePhotoDraft(){if(!editorOwned||!photoDraftReady||!photoDB)return;
  const version=++photoSaveVersion;
  const fields=currentDraftFields();
  const photos=[];[...DEFECT_KEYS,"label"].forEach(key=>TCFG[key].arr.forEach(p=>{
    const file=p.c||p.file;photos.push({key,blob:file,name:file.name||"photo.jpg",seq:p.seq});}));
  photoSavePending++;draftStatus("사진·입력 임시저장 중… 저장 완료 후 닫아 주세요.");
  // 요청 순서대로 저장하므로 초기화·삭제 뒤 오래된 사진이 덮어쓰지 않는다.
  photoSaveChain=photoSaveChain.then(()=>photoDraftTransaction("readwrite",{schema:2,fields,photos})).then(()=>{
    if(version===photoSaveVersion){LS.set("dr_draft",fields);photoSaveFailed=false;draftStatus(`사진 ${photos.length}장·입력 임시저장 완료 · 같은 브라우저에서 복원돼요.`);}
  }).catch(()=>{if(version===photoSaveVersion){photoSaveFailed=true;draftStatus("사진·입력 임시저장 실패 · 저장 공간을 확인해 주세요. 화면을 닫으면 최근 변경이 유실될 수 있어요.",true);}
  }).finally(()=>{photoSavePending--;});
}
function applyDraftFields(value){const d=value&&typeof value==="object"&&!Array.isArray(value)?value:{};
  const text=v=>typeof v==="string"?v:"";
  $("ipgo").value=typeof d.ipgo==="string"?d.ipgo:todayMD();$("gihan").value=text(d.gihan);
  kind=normalizeKind(d.kind,KINDS[0]);maker=text(d.maker).trim()||text(d.etc).trim();
  $("makerEtc").value=makers.includes(maker)?"":maker;
  bong=text(d.bong);$("bongEtc").value=BONG.some(n=>String(n)===bong)?"":bong;
  $("actualCount").value=text(d.actualCount);
  $("kindToggle").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.k===kind));
  renderMakerChips();renderBongChips();
}
function sessionMessage(message){$("appContent").inert=true;$("actionBar").inert=true;$("sessionGate").hidden=false;$("sessionMessage").textContent=message;}
async function restorePhotoDraft(){
  if(!editorOwned)return false;
  sessionMessage("사진과 입력 내용을 불러오고 있어요…");
  const restored=[];
  try{photoDB=await openPhotoDB();
    photoDB.onversionchange=()=>{photoDB.close();photoDB=null;photoDraftReady=false;photoSaveFailed=true;sessionMessage("저장 연결이 변경됐어요. 새로고침 후 다시 이용해 주세요.");};
    const saved=await photoDraftTransaction("readonly");
    if(saved!==undefined&&(!saved||!Array.isArray(saved.photos)))throw new Error("잘못된 임시저장");
    if(saved?.schema!==undefined&&saved.schema!==2)throw new Error("지원하지 않는 임시저장 형식");
    if(saved?.schema===2&&(!saved.fields||typeof saved.fields!=="object"||Array.isArray(saved.fields)))throw new Error("잘못된 입력 정보");
    for(const item of saved?.photos||[]){
      if(!item||![...DEFECT_KEYS,"label"].includes(item.key)||!(item.blob instanceof Blob))throw new Error("잘못된 사진");
      const file=new File([item.blob],typeof item.name==="string"?item.name:"photo.jpg",{type:item.blob.type});
      restored.push({key:item.key,p:{file,c:file,url:URL.createObjectURL(file),seq:++photoSeq,ready:Promise.resolve()}});
    }
    // 잠금 대기 중 다른 탭에서 변경됐을 수 있으므로 최신 목록·기록을 다시 읽는다.
    const latestMakers=LS.get("dr_makers",DEFAULT_MAKERS.slice());
    makers=Array.isArray(latestMakers)?[...new Set(latestMakers.filter(m=>typeof m==="string").map(m=>m.trim()).filter(Boolean))]:DEFAULT_MAKERS.slice();
    const latestHistory=LS.get("dr_history",[]);history=Array.isArray(latestHistory)?latestHistory.filter(h=>h&&typeof h.t==="string"&&typeof h.m==="string").slice(0,20):[];
    applyDraftFields(saved?.schema===2?saved.fields:LS.get("dr_draft",null));
    [...DEFECT_KEYS,"label"].forEach(key=>{TCFG[key].arr.forEach(p=>URL.revokeObjectURL(p.url));TCFG[key].arr.length=0;});
    restored.forEach(({key,p})=>TCFG[key].arr.push(p));renderHistory();
    renderDefectUI();renderThumbsFor("label");render();updateShareUI();photoDraftReady=true;
    // 기본 날짜도 첫 실행에서 저장한다. 구버전 사진은 현재 초안과 함께 통합 형식으로 이전한다.
    if(saved?.schema!==2){savePhotoDraft();await photoSaveChain;}
    else draftStatus(`사진 ${restored.length}장·입력 복원 완료 · 변경하면 자동 저장돼요.`);
    $("appContent").inert=false;$("actionBar").inert=false;$("sessionGate").hidden=true;return true;
  }catch(e){restored.forEach(({p})=>URL.revokeObjectURL(p.url));photoSaveFailed=true;
    if(photoDB)photoDB.close();photoDB=null;
    draftStatus("임시저장을 불러오지 못했어요. 저장된 내용은 유지됩니다.",true);
    sessionMessage("저장 내용을 불러올 수 없어요.\n다른 작업을 닫고 새로고침해 주세요.\n저장된 내용은 덮어쓰지 않았어요.");return false;
  }
}
window.addEventListener("beforeunload",e=>{if(photoSavePending||photoSaveFailed&&(totalCount()||photoSaveVersion)||processingPhotoCount()){
  e.preventDefault();e.returnValue="";}});
async function startEditorSession(){
  sessionMessage("다른 탭에서 작업 중이면 이 화면은 대기합니다.\n기존 탭을 닫으면 저장된 내용을 불러와 이어서 작업할 수 있어요.");
  if(!navigator.locks?.request){sessionMessage("이 브라우저에서는 안전한 탭 전환을 지원하지 않아요.\n최신 삼성인터넷 또는 크롬의 HTTPS 주소에서 열어 주세요.");return;}
  try{await navigator.locks.request("defect-report-editor",{mode:"exclusive"},async()=>{
    editorOwned=true;
    try{await restorePhotoDraft();await new Promise(()=>{});}finally{editorOwned=false;}
  });}catch(e){editorOwned=false;sessionMessage("작업 권한을 확인할 수 없어요. 새로고침해 주세요.");}
}
// 뒤로가기로 메모리에 남아 있던 페이지로 돌아오면 잠금·저장 상태를 다시 확인한다.
window.addEventListener("pageshow",e=>{if(e.persisted)window.location.reload();});
startEditorSession();
</script>
