<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부 음성입력">
<title>가계부 — 음성 지출 입력</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: rgba(255,255,255,0.07);
    --accent: #6c6fff;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e8e8f0;
    --text2: #8888aa;
    --text3: #4a4a66;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* LOGIN */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    gap: 32px;
    padding: 24px;
  }
  .login-logo {
    font-size: 56px;
    filter: drop-shadow(0 0 24px rgba(108,111,255,0.4));
  }
  .login-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .login-sub {
    font-size: 14px;
    color: var(--text2);
    text-align: center;
    line-height: 1.6;
  }
  .btn-google {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 28px;
    border-radius: 14px;
    font-size: 15px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-google:active { transform: scale(0.97); }

  /* MAIN */
  #main-screen { display: none; flex-direction: column; min-height: 100dvh; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    padding-top: calc(16px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-user {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
  }

  /* CONTENT */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 32px;
    position: relative;
  }

  /* STATE LABEL */
  .state-label {
    font-size: 13px;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
    transition: color 0.3s;
  }
  .state-label.listening { color: var(--accent); }
  .state-label.processing { color: var(--yellow); }
  .state-label.done { color: var(--green); }

  /* MIC BUTTON */
  .mic-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-ring {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .mic-ring.active {
    opacity: 0.3;
    animation: ring-pulse 1.5s ease-in-out infinite;
  }
  .mic-ring:nth-child(2) { animation-delay: 0.5s !important; width: 190px; height: 190px; }
  @keyframes ring-pulse {
    0%, 100% { transform: scale(0.95); opacity: 0.3; }
    50% { transform: scale(1.05); opacity: 0.08; }
  }

  .mic-btn {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: var(--surface2);
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
    z-index: 1;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .mic-btn:active { transform: scale(0.94); }
  .mic-btn.listening {
    background: var(--accent);
    border-color: var(--accent2);
    box-shadow: 0 0 40px rgba(108,111,255,0.35), 0 8px 32px rgba(0,0,0,0.4);
  }
  .mic-btn.processing {
    background: var(--surface2);
    border-color: var(--yellow);
    box-shadow: 0 0 30px rgba(251,191,36,0.2);
    cursor: default;
  }
  .mic-icon { font-size: 48px; transition: all 0.2s; user-select: none; }

  /* TRANSCRIPT */
  .transcript-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    width: 100%;
    max-width: 400px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .transcript-text {
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
    color: var(--text2);
  }
  .transcript-text.filled { color: var(--text); }

  .hint-text {
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    line-height: 1.7;
  }
  .hint-text span { color: var(--text2); }

  /* RESULT CARD */
  #result-section {
    display: none;
    flex-direction: column;
    gap: 0;
    width: 100%;
    max-width: 420px;
    animation: slide-up 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    overflow: hidden;
  }
  .result-header {
    padding: 16px 20px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .result-rows { padding: 8px 0; }
  .result-row {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .result-row:last-child { border-bottom: none; }
  .result-row-label {
    font-size: 12px;
    color: var(--text2);
    width: 72px;
    flex-shrink: 0;
  }
  .result-row-value {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
  }
  .result-row-value.amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent2);
    font-weight: 600;
  }
  .result-row-value.editable {
    border: none;
    background: var(--surface2);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    width: 100%;
    outline: none;
    border: 1px solid transparent;
  }
  .result-row-value.editable:focus { border-color: var(--accent); }

  /* WARNING */
  .warn-box {
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.25);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 8px 20px;
    font-size: 12px;
    color: var(--yellow);
    display: none;
  }

  /* ACTION BUTTONS */
  .action-row {
    display: flex;
    gap: 10px;
    padding: 0;
  }
  .btn-retry {
    flex: 1;
    padding: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 0 0 0 20px;
    color: var(--text2);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-save {
    flex: 2;
    padding: 16px;
    background: var(--accent);
    border: none;
    border-radius: 0 0 20px 0;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-retry:active { opacity: 0.7; }
  .btn-save:active { opacity: 0.85; transform: scale(0.99); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: calc(32px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* LOADING SPINNER */
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* HISTORY */
  .history-section {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0;
    padding-bottom: env(safe-area-inset-bottom);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
  }
  .history-section.open { max-height: 320px; }
  .history-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    position: fixed;
    bottom: env(safe-area-inset-bottom);
    left: 0; right: 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--text2);
    z-index: 101;
    transition: bottom 0.4s;
  }
  .history-inner { padding: 16px 20px; overflow-y: auto; max-height: 280px; }
  .history-title { font-size: 12px; color: var(--text2); letter-spacing: 1.5px; margin-bottom: 12px; }
  .history-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .history-item:last-child { border-bottom: none; }
  .h-cat { font-size: 11px; color: var(--text2); }
  .h-amount { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; margin-left: auto; }
  .h-method { font-size: 11px; color: var(--text3); margin-left: 8px; }
  .h-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  select.result-row-value.editable {
    -webkit-appearance: none;
    appearance: none;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">🎙️</div>
  <div class="login-title">가계부 — 음성 지출 입력</div>
  <div class="login-sub">말하는 순간 가계부에 기록됩니다<br>가계부와 동일한 계정으로 로그인하세요</div>
  <button class="btn-google" onclick="doLogin()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#EA4335" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#4285F4" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#34A853" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
    Google로 로그인
  </button>
</div>

<!-- MAIN -->
<div id="main-screen">
  <div class="header">
    <div class="header-title">🎙️ 가계부 음성입력</div>
    <div class="header-user">
      <span id="user-name"></span>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="content" id="main-content">
    <div class="state-label" id="state-label">대기 중</div>

    <div class="mic-wrap">
      <div class="mic-ring" id="ring1"></div>
      <div class="mic-ring" id="ring2"></div>
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">
        <span class="mic-icon" id="mic-icon">🎤</span>
      </button>
    </div>

    <div class="transcript-box">
      <div class="transcript-text" id="transcript-text">버튼을 눌러 말하세요</div>
    </div>

    <div class="spinner" id="spinner"></div>

    <div id="result-section">
      <div class="result-card">
        <div class="result-header">인식 결과 확인</div>
        <div class="result-rows">
          <div class="result-row">
            <div class="result-row-label">금액</div>
            <div class="result-row-value amount" id="res-amount">—</div>
          </div>
          <div class="result-row">
            <div class="result-row-label">카테고리</div>
            <select class="result-row-value editable" id="res-cat"></select>
          </div>
          <div class="result-row">
            <div class="result-row-label">세부분류</div>
            <select class="result-row-value editable" id="res-subcat"></select>
          </div>
          <div class="result-row">
            <div class="result-row-label">결제수단</div>
            <select class="result-row-value editable" id="res-method"></select>
          </div>
          <div class="result-row">
            <div class="result-row-label">메모</div>
            <input class="result-row-value editable" id="res-memo" type="text" placeholder="(선택사항)">
          </div>
          <div class="result-row">
            <div class="result-row-label">날짜</div>
            <input class="result-row-value editable" id="res-date" type="date">
          </div>
        </div>
        <div class="warn-box" id="warn-box"></div>
        <div class="action-row">
          <button class="btn-retry" onclick="resetToIdle()">다시 말하기</button>
          <button class="btn-save" onclick="saveExpense()">✓ 저장</button>
        </div>
      </div>
    </div>

    <div class="hint-text" id="hint-text">
      예시: <span>"식비 13000원 삼성카드"</span><br>
      <span>"교통비 3500원 현금"</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0hxBZ4X-CB_x6DXwj73qEuJlBWp6trtw",
  authDomain: "personal-apps-hty.firebaseapp.com",
  projectId: "personal-apps-hty",
  storageBucket: "personal-apps-hty.firebasestorage.app",
  messagingSenderId: "1094404789428",
  appId: "1:1094404789428:web:87efdfbbb9bc08a00433e1",
  measurementId: "G-48CFC1W4ZR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let curUser = null;
let categories = [];
let paymentMethods = [];
let recognition = null;
let isListening = false;
let parsedData = null;

// ─── AUTH ───────────────────────────────────────────
window.doLogin = async () => {
  try { await signInWithPopup(auth, provider); }
  catch(e) { showToast('로그인 실패: ' + e.message, 'error'); }
};
window.doLogout = async () => {
  await signOut(auth);
  location.reload();
};

onAuthStateChanged(auth, async user => {
  if (user) {
    curUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    document.getElementById('user-name').textContent = user.displayName?.split(' ')[0] || '';
    await loadUserData();
    initSpeech();
    loadHistory();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-screen').style.display = 'none';
  }
});

function up(col) { return `users/${curUser.uid}/${col}`; }

// ─── LOAD DATA ───────────────────────────────────────
async function loadUserData() {
  try {
    const [catSnap, pmSnap] = await Promise.all([
      getDocs(collection(db, up('categories'))),
      getDocs(collection(db, up('paymentMethods')))
    ]);
    categories = catSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    paymentMethods = pmSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    populateCatSelect();
    populateMethodSelect();
  } catch(e) {
    showToast('데이터 로드 실패', 'error');
  }
}

function populateCatSelect(selectedCat = '', selectedSub = '') {
  const sel = document.getElementById('res-cat');
  sel.innerHTML = '';
  categories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = c.name;
    if (c.name === selectedCat) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => updateSubCats(sel.value, '');
  updateSubCats(sel.value, selectedSub);
}

function updateSubCats(catName, selectedSub = '') {
  const sel = document.getElementById('res-subcat');
  sel.innerHTML = '';
  const cat = categories.find(c => c.name === catName);
  const subs = cat?.subs || [];
  const none = document.createElement('option');
  none.value = ''; none.textContent = '(세부분류 없음)';
  sel.appendChild(none);
  subs.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    if (s === selectedSub) opt.selected = true;
    sel.appendChild(opt);
  });
}

function populateMethodSelect(selected = '') {
  const sel = document.getElementById('res-method');
  sel.innerHTML = '';
  const none = document.createElement('option');
  none.value = ''; none.textContent = '(없음/현금)';
  sel.appendChild(none);
  paymentMethods.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.name; opt.textContent = m.name;
    if (m.name === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ─── SPEECH ──────────────────────────────────────────
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('이 브라우저는 음성 인식을 지원하지 않아요', 'error'); return; }
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    const txt = document.getElementById('transcript-text');
    txt.textContent = final || interim || '듣고 있어요...';
    txt.className = 'transcript-text filled';
    if (final) { stopListening(); processText(final.trim()); }
  };
  recognition.onerror = e => {
    stopListening();
    if (e.error !== 'no-speech') showToast('인식 오류: ' + e.error, 'error');
  };
  recognition.onend = () => { if (isListening) stopListening(); };
}

window.toggleMic = () => {
  if (isListening) { stopListening(); return; }
  if (document.getElementById('mic-btn').classList.contains('processing')) return;
  startListening();
};

function startListening() {
  if (!recognition) return;
  resetToIdle(true);
  isListening = true;
  recognition.start();
  setUIState('listening');
  document.getElementById('transcript-text').textContent = '듣고 있어요...';
  document.getElementById('transcript-text').className = 'transcript-text';
}

function stopListening() {
  isListening = false;
  if (recognition) try { recognition.stop(); } catch(e) {}
}

window.resetToIdle = (silent) => {
  stopListening();
  setUIState('idle');
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('hint-text').style.display = '';
  document.getElementById('transcript-text').textContent = '버튼을 눌러 말하세요';
  document.getElementById('transcript-text').className = 'transcript-text';
  document.getElementById('warn-box').style.display = 'none';
  parsedData = null;
};

function setUIState(state) {
  const btn = document.getElementById('mic-btn');
  const icon = document.getElementById('mic-icon');
  const label = document.getElementById('state-label');
  const spinner = document.getElementById('spinner');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');

  btn.className = 'mic-btn';
  ring1.className = 'mic-ring';
  ring2.className = 'mic-ring';
  label.className = 'state-label';
  spinner.style.display = 'none';

  if (state === 'idle') {
    icon.textContent = '🎤'; label.textContent = '대기 중';
  } else if (state === 'listening') {
    btn.classList.add('listening'); ring1.classList.add('active'); ring2.classList.add('active');
    icon.textContent = '⏹️'; label.textContent = '듣고 있어요'; label.classList.add('listening');
  } else if (state === 'processing') {
    btn.classList.add('processing'); icon.textContent = '⏳';
    label.textContent = '분석 중'; label.classList.add('processing');
    spinner.style.display = 'block';
  } else if (state === 'done') {
    icon.textContent = '✓'; label.textContent = '확인해주세요'; label.classList.add('done');
  }
}

// ─── CLAUDE API PARSE ────────────────────────────────
async function processText(text) {
  setUIState('processing');
  document.getElementById('hint-text').style.display = 'none';

  const catList = categories.map(c => `${c.name}(${(c.subs||[]).join('/')})`).join(', ');
  const methodList = paymentMethods.map(m => m.name).join(', ');
  const today = new Date().toISOString().slice(0, 10);

  const prompt = `사용자의 음성 지출 입력을 파싱해주세요.

입력: "${text}"

사용 가능한 카테고리(세부분류): ${catList || '정보없음'}
사용 가능한 결제수단: ${methodList || '정보없음'}
오늘 날짜: ${today}

다음 JSON 형식으로만 응답하세요 (마크다운 없이 순수 JSON):
{
  "amount": 숫자(원 단위, 인식 못하면 0),
  "category": "가장 적합한 카테고리명",
  "subCategory": "세부분류명 또는 빈문자열",
  "paymentMethod": "결제수단명 또는 빈문자열",
  "memo": "메모 또는 빈문자열",
  "date": "YYYY-MM-DD",
  "warnings": ["주의사항 배열, 없으면 빈배열"]
}

규칙:
- amount는 반드시 숫자만
- 카테고리는 목록에서 가장 유사한 것으로
- 결제수단은 목록에서 유사한 것으로, 없으면 빈문자열
- 날짜 언급 없으면 오늘 날짜`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content?.[0]?.text || '';
    const cleaned = raw.replace(/```json|```/g, '').trim();
    parsedData = JSON.parse(cleaned);
    showResult(parsedData);
  } catch(e) {
    showToast('파싱 실패, 직접 입력해주세요', 'error');
    setUIState('idle');
    document.getElementById('hint-text').style.display = '';
  }
}

function showResult(data) {
  setUIState('done');
  const fmt = n => n ? Number(n).toLocaleString('ko-KR') + '원' : '?원';
  document.getElementById('res-amount').textContent = fmt(data.amount);
  populateCatSelect(data.category, data.subCategory);
  populateMethodSelect(data.paymentMethod);
  document.getElementById('res-memo').value = data.memo || '';
  document.getElementById('res-date').value = data.date || new Date().toISOString().slice(0,10);

  const warnBox = document.getElementById('warn-box');
  if (data.warnings?.length) {
    warnBox.textContent = '⚠️ ' + data.warnings.join(' / ');
    warnBox.style.display = 'block';
  } else {
    warnBox.style.display = 'none';
  }

  document.getElementById('result-section').style.display = 'flex';
}

// ─── SAVE ────────────────────────────────────────────
window.saveExpense = async () => {
  if (!curUser) return;
  const amount = parsedData?.amount || 0;
  if (!amount) { showToast('금액이 인식되지 않았어요', 'error'); return; }

  const category = document.getElementById('res-cat').value;
  const subCategory = document.getElementById('res-subcat').value;
  const paymentMethod = document.getElementById('res-method').value;
  const memo = document.getElementById('res-memo').value.trim();
  const date = document.getElementById('res-date').value;

  const expense = {
    amount: Math.round(Number(amount)),
    category,
    subCategory,
    paymentMethod,
    memo,
    date,
    month: date.slice(0, 7),
    createdAt: serverTimestamp(),
    source: 'voice'
  };

  try {
    document.querySelector('.btn-save').disabled = true;
    document.querySelector('.btn-save').textContent = '저장 중...';
    await addDoc(collection(db, up('expenses')), expense);
    showToast(`✓ ${category} ${amount.toLocaleString('ko-KR')}원 저장됨`, 'success');
    saveToHistory({ ...expense, createdAt: new Date() });
    resetToIdle();
    loadHistory();
  } catch(e) {
    showToast('저장 실패: ' + e.message, 'error');
    document.querySelector('.btn-save').disabled = false;
    document.querySelector('.btn-save').textContent = '✓ 저장';
  }
};

// ─── LOCAL HISTORY ───────────────────────────────────
function saveToHistory(expense) {
  const key = `voice_history_${curUser.uid}`;
  const hist = JSON.parse(localStorage.getItem(key) || '[]');
  hist.unshift(expense);
  if (hist.length > 20) hist.pop();
  localStorage.setItem(key, JSON.stringify(hist));
}
